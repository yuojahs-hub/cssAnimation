            .circle {
                width: 10px;
                height: 10px;
                background-color: #fff;
                border-radius: 50%;
                margin: 5px 10px;
                transform-origin: center top;
                animation: spin 1s linear infinite;
            }
            .row {

            }
            .row:nth-child(1) .circle {

            }

            .row:nth-child(12) .circle {

            @keyframes spin {
                0% {
                    transform: rotate(0) scale(1);
                }
                50% {
