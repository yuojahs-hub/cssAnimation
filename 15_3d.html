<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .world {
                width: 60vw;
                height: 60vh;
                background-image: linear-gradient(-20deg, #ddd6f3 0%, #faaca8 100%, #faaca8 100%);
                margin: 0 auto;
                display: flex;
                justify-content: center;
                align-items: center;

                perspective: 300px;
            }
            .card {
                width: 100px;
                height: 150px;
                position: relative;
                transition: all 1s;
                transform-style: preserve-3d;
                /* 3d 적용된다는 것을 선언 또는 자식한테 관통한다 */
            }
            .card_side {
                width: 100%;
                height: 100%;
                border-radius: 20px;
                position: absolute;
                top: 0;
                left: 0;

                display: flex;
                justify-content: center;
                align-items: center;
                color: #ffffff;
                font-size: 24px;
                font-weight: bold;

                backface-visibility: hidden;
            }
            .front {
                background-color: #afa7ca;
                z-index: 1;
            }
            .back {
                background-color: #b9807e;
                transform: rotateY(180deg);
            }
            .world:hover .card {
                transform: rotateY(180deg);
            }
        </style>
    </head>
    <body>
        <div class="world">
            <div class="card">
                <div class="card_side front">FRONT</div>
                <div class="card_side back">BACK</div>
            </div>
        </div>
    </body>
</html>
