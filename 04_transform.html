<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            div {
                width: 100px;
                height: 100px;
                background: red;
                margin: 50px auto;
                font-size: 20px;
                color: #ffffff;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #box01 {
                transition: all 0.5s;
            }
            #box01:hover {
                background: yellow;
                transform: scale(2, 1.5);
            }
            #box02 {
                transition: all 0.5s;
            }
            #box02:hover {
                background: rgb(0, 255, 21);
                transform: rotate(360deg);
            }
            #box03 {
                transition: all 0.5s;
            }
            #box03:hover {
                background: rgb(0, 255, 234);
                transform: skew(-80deg);
            }
            #box04 {
                transition: all 0.5s;
            }
            #box04:hover {
                background: rgb(0, 68, 255);
                transform: translate(200px, -100px);
            }
            #box05 {
                transition: all 0.5s;
            }
            #box05:hover {
                background: rgb(153, 0, 255);
                transform: scale(2) rotate(180deg);
            }
            #box06 {
                transition: all 0.5s;
            }
            #box06:hover {
                background: rgb(255, 0, 170);
                transform-origin: 100% 100%;
                transform: scale(2) rotate(180deg);
            }
        </style>
    </head>
    <body>
        <div id="box01">scale</div>
        <div id="box02">rotate</div>
        <div id="box03">skew</div>
        <div id="box04">translate</div>
        <div id="box05">all</div>
        <div id="box06">origin</div>
    </body>
</html>
