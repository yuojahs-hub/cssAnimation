<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            #gragh {
                width: 610px;
                border: 1px solid #000;
            }
            .bar {
                width: 10px;
                height: 50px;
                background-color: pink;
                margin-bottom: 10px;
                transition: all 1s;
            }
            .bar:nth-child(1) {
                transition-timing-function: linear;
            }
            .bar:nth-child(2) {
                transition-timing-function: ease;
            }
            .bar:nth-child(3) {
                transition-timing-function: ease-in;
            }
            .bar:nth-child(4) {
                transition-timing-function: ease-in-out;
            }
            .bar:nth-child(5) {
                transition-timing-function: ease-out;
            }
            .bar:nth-child(6) {
                transition-timing-function: cubic-bezier(0.79, -0.36, 0, 1.11);
            }
            #gragh:hover .bar:nth-child(1) {
                background-color: #ff0000;
                width: 600px;
            }
            #gragh:hover .bar:nth-child(2) {
                background-color: #ff9100;
                width: 600px;
            }
            #gragh:hover .bar:nth-child(3) {
                background-color: #ffe600;
                width: 600px;
            }
            #gragh:hover .bar:nth-child(4) {
                background-color: #00ff15;
                width: 600px;
            }
            #gragh:hover .bar:nth-child(5) {
                background-color: #1a01ff;
                width: 600px;
            }
            #gragh:hover .bar:nth-child(6) {
                background-color: #a200ff;
                width: 600px;
            }
        </style>
    </head>
    <body>
        <h1>Transition</h1>
        <div id="gragh">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </body>
</html>
