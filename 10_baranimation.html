<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body {
                height: 100vh;
                background-image: linear-gradient(
                    to right,
                    #eea2a2 0%,
                    #bbc1bf 19%,
                    #57c6e1 42%,
                    #b49fda 79%,
                    #7ac5d8 100%
                );
            }
            .bar {
                width: 5px;
                height: 400px;
                background-color: #fff;

                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                top: 0;
                margin: auto;
                /* 상하좌우 가운데 위치하기 */

                animation-name: bar;
                animation-duration: 2s;
                animation-iteration-count: infinite;
                animation-timing-function: cubic-bezier(1, 0.19, 0.32, 0.68);
            }
            @keyframes bar {
                0% {
                    height: 0;
                    transform: rotate(0);
                }
                25% {
                    height: 400px;
                    transform: rotate(0);
                }
                50% {
                    height: 400px;
                    transform: rotate(180deg);
                }
                100% {
                    height: 0;
                    transform: rotate(180deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="bar"></div>
    </body>
</html>
