<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            div {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #ffffff;
                font-size: 26px;
                position: absolute;
            }
            #wrap {
                background: #000;
            }
            #wrap:hover > div {
                animation-name: ani;
                animation-duration: 3s;
                /* animation-iteration-count: infinite; 무한반복 */
                /* animation-direction: alternate; 리버스 */
                animation-fill-mode: forwards;
                animation-timing-function: cubic-bezier(0.075, 0.82, 0.165, 1);
            }
            @keyframes ani {
                0% {
                    background: #000;
                    left: 0;
                    top: 0;
                    transform: rotate(0) scale(1, 1);
                }
                25% {
                    background: blue;
                    left: 300px;
                    top: 700px;
                }
                50% {
                    background: rgb(192, 192, 238);
                    left: 600px;
                    top: 100px;
                }
                75% {
                    background: rgb(72, 231, 218);
                    left: 1000px;
                    top: 900px;
                }
                100% {
                    background: green;
                    left: 1300px;
                    top: 0px;
                    transform: rotate(720deg) scale(2, 2);
                }
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <div>BALL</div>
        </div>
    </body>
</html>
